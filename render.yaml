# Render blueprint. The database is Neon (created separately), so DATABASE_URL
# is set in the Render dashboard rather than provisioned here.
services:
  - type: web
    name: invoice-pipeline
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: AUTO_SEED_ON_BOOT
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      # Set these in the Render dashboard - never commit them.
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
